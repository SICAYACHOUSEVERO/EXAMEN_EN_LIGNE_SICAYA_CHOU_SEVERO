<!DOCTYPE html>
<html lang="fr" class="hydrated">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau Examen - SICAYA CHOU Severo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/CSS/style.css">
</head>

<body >
        <div class="wrapper">
            <!-- Connexion -->
            <section >
                <h1>Nouveau Examen</h1>
                <form id="examen_form" action="/profile" method="post">
                    <div class="inputbox2">
                        <input type="text" id="titre" name="titre" placeholder="Titre" required>
                    </div>
                    <div class="inputbox2">
                        <textarea class="descripcion" id="description" id="name" placeholder="Descrption de l'examen" ></textarea>
                    </div>

                    <div class="inputbox2">
                        <select name="cible" id="cible" required>
                           <option value="" disabled selected>Choisissez le public ciblé</option>
                           <option value="1 MIP S1">1 MIP S1</option>
                           <option value="1 MIP S2">1 MIP S2</option>
                           <option value="2 MIP S3">2 MIP S3</option>
                           <option value="2 MIP S4">2 MIP S4</option>
                           <option value="3 MIP S5">3 MIP S5</option>
                           <option value="3 MIP S6">3 MIP S6</option>
                        </select>
                    </div>

                    <hr>
                   	<h5>Questions</h5>
                    <div id="questions">
	                    <div class="inputbox2" id="question1">
	                    	<h6>Question #1</h6>
	                        <textarea id="ennonce1" id="ennonce1" placeholder="Tapez l'ennonce de la question" ></textarea>
	                    </div>
                    </div>

                    <input type="hidden" name="numeroq" id="numeroq" value="1">

                    <p onclick="ajouter_question()" href="">Ajouter une autre question </p>
    <script type="text/javascript">
    	function ajouter_question(){
      	 	numquestions=parseInt(document.getElementById('numeroq').value);

      	 	var nuevoDiv = document.createElement("div");
      		nuevoDiv.id = "question2";
      		nuevoDiv.name = "question2";
      		nuevoDiv.className = "inputbox2";

var divQ = "<h6>Question #" + (numquestions + 1) + "</h6>" +
           "<textarea id='ennonce" + (numquestions + 1) + "' " +
           "name='ennonce" + (numquestions + 1) + "' " +
           "placeholder=\"Tapez l'énoncé de la question\">" +
           "</textarea>"; 	
      	 	nuevoDiv.innerHTML = divQ;
      	 	document.getElementById('numeroq').value=(numquestions+1);
			document.getElementById('questions').appendChild(nuevoDiv);
			}
      </script>

                   
                   
                    <button type="submit">Valider</button>
                    
                </form>
            </section>

            <!-- Inscription -->
            <section class="register">                
            </section>
        </div>

    <script src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="/JS/script.js"></script>
</body>

</html>
