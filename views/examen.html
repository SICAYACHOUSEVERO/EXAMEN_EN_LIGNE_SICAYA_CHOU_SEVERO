<!DOCTYPE html>
<html lang="fr" class="hydrated">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau Examen - SICAYA CHOU Severo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/CSS/style.css">
</head>

<body >
    <section class="section_examen" >
        <h1>Nouveau Examen</h1>
        <form id="examen_form" action="/profile" method="post" enctype="multipart/form-data">
            <div class="inputbox2">
                <input class="titre" type="text" id="titre" name="titre" placeholder="Titre" required>
            </div>
            <div class="inputbox2">
                <textarea class="description" id="description" id="name" placeholder="Descrption de l'examen" ></textarea>
            </div>

            <div class="inputbox2">
                <select name="cible" id="cible" required>
                   <option value="" disabled selected>Choisissez le public ciblé</option>
                   <option value="1 MIP S1">1 MIP S1</option>
                   <option value="1 MIP S2">1 MIP S2</option>
                   <option value="2 MIP S3">2 MIP S3</option>
                   <option value="2 MIP S4">2 MIP S4</option>
                   <option value="3 MIP S5">3 MIP S5</option>
                   <option value="3 MIP S6">3 MIP S6</option>
                </select>


            </div>

            <hr>
           	<h5>Questions</h5>
            <div class="row" id="questions"></div>

            <input type="hidden" name="numeroq" id="numeroq" value="0">



        <div class="row">
            <p>Ajouter une autre question 
                <button type="button" class="button_ajouter" onclick="ajouter_question('D')"> Directe</button> 
                ou 
                <button type="button" class="button_ajouter" onclick="ajouter_question('Q')">QCM</button> 
            </p>  
            <button type="submit">Valider</button>
        </div>
            
        </form>
    </section> 
    <script src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="/JS/script.js"></script>
</body>

</html>
