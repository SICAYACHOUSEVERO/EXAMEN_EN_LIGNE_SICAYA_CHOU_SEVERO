<!DOCTYPE html>
<html lang="fr" class="hydrated">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Login & Register - SICAYA CHOU Severo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/CSS/style.css">
</head>

<body style="background: url('../images/R.jpg');">
    <div class="container">
        <div class="wrapper">
            <!-- Connexion -->
            <section class="login">
                <h1>Connexion</h1>
                <form id="login_form" action="/profile" method="post">
                    <div class="inputbox">
                        <ion-icon name="mail"></ion-icon>
                        <input type="email" id="email_login" name="email_login" placeholder="Saisissez votre e-mail"  required>
                    </div>
                    <div class="inputbox">
                        <ion-icon name="lock-closed-outline"></ion-icon>
                        <input type="password" id="password_login" name="password_login" placeholder="Saisissez votre mot de passe"  required>
                    </div>

                    <div class="inputbox">
                        <input class="checkbox" type="checkbox" id="tipe_login" name="tipe_login" >
                        Se connecter comme enseignant
                    </div>
                    <div class="forgot">
                        <a href="">Mot de passe oublié?</a>
                    </div>
                    <button type="submit">Se connecter</button>
                    <div class="register-option">
                        <span>Pas de compte?</span>
                        <a href="" id="switch-to-register">Inscrivez-Vous</a>
                    </div>
                </form>
            </section>

            <!-- Inscription -->
            <section class="register">
                <h1>Inscription</h1>
                <form id="register_form" method="POST" action="/inserer_utilisateur">
                    <div class="row">
                        <div class="col lg-4 ">
                            <div class="inputbox">
                                <ion-icon name="person-outline"></ion-icon>
                                <input type="text" id="nom" name="nom" placeholder="Nom" required>
                            </div>
                        </div>
                        <div class="col lg-4 ">
                            <div class="inputbox">
                                <ion-icon name="person-outline"></ion-icon>
                                <input type="text" placeholder="Prénom"  id="prenom" name="prenom" required>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col lg-4 ">
                            <div class="inputbox">
                                <ion-icon name="mail-outline"></ion-icon>
                                <input type="email" id="email" name="email" placeholder="E-mail" required>
                            </div>
                        </div>
                        <div class="col lg-4 ">
                            <div class="inputbox">
                                <ion-icon name="lock-closed-outline"></ion-icon>
                                <input type="password" id="password" name="password"  placeholder="Mot de passe"  required>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col lg-4 ">
                            <div class="inputbox">
                                <ion-icon name="calendar-outline"></ion-icon>
                                <label for="ddns">Date de naissance</label>
                                <input type="date" id="ddns" name="ddns" width="0" height="0" required>
                            </div>
                        </div>
                        <div class="col lg-4 ">
                            <div class="inputbox">
                                <ion-icon name="transgender-outline"></ion-icon>
                                <select name="cible" id="cible" required>
                                   <option value="" disabled selected>Sexe</option>
                                   <option value="M">Male</option>
                                   <option value="F">Female</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col lg-4 ">
                            <div class="inputbox">
                                <input type="text" id="etablissement" name="etablissement" placeholder="Etablissement"  required>
                            </div>
                        </div>
                        <div class="col lg-4 ">
                            <div class="inputbox">
                                <input type="text" id="filiere" name="filiere" placeholder="Filière"  required>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col lg-4">
                            <div class="inputbox">
                                <input class="checkbox" type="checkbox" id="tipe" name="tipe" >
                                Je suis un enseignant
                            </div>
                        </div>
                    </div>
                    <button type="submit">S'inscrire</button>
                    <div class="register-option">
                        <span>Vous avez déjà un compte?</span>
                        <a href="" id="switch-to-login">Connectez-Vous</a>
                    </div>
                </form>
            </section>
        </div>
    </div>

    <script src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="/JS/script.js"></script>
</body>

</html>
